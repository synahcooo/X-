name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "源码 ZIP 路径（仓库根目录相对路径）；留空则自动扫描根目录 ZIP"
        required: false
        default: ""
      build_task:
        description: "Gradle 构建任务"
        required: false
        default: "assembleDebug"
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and extract Android Gradle project
        id: locate
        shell: bash
        run: |
          python3 - <<'PY'
          import os, zipfile, shutil
          from pathlib import Path
          import xml.etree.ElementTree as ET

          repo = Path(".").resolve()
          requested = "${{ inputs.source_zip }}".strip()
          candidates = [repo / requested] if requested else sorted(repo.glob("*.zip"))
          candidates = [p for p in candidates if p.is_file() and p.suffix.lower() == ".zip"]
          if not candidates:
              raise SystemExit("没有找到源码 ZIP。请将 ZIP 上传到仓库根目录，或在 workflow_dispatch 指定路径。")

          work = repo / "_android_source"
          if work.exists(): shutil.rmtree(work)
          work.mkdir()

          def safe_extract(zf, dest):
              root = dest.resolve()
              for info in zf.infolist():
                  target = (dest / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError("ZIP 路径越界风险: " + info.filename)
              zf.extractall(dest)

          extracted = []
          for idx, zpath in enumerate(candidates):
              dest = work / f"zip_{idx}"
              dest.mkdir()
              with zipfile.ZipFile(zpath) as zf:
                  if zf.testzip():
                      raise SystemExit(f"ZIP 校验失败: {zpath.name}")
                  safe_extract(zf, dest)
              extracted.append(dest)

          # Unpack at most two nested ZIP levels.
          for depth in range(2):
              nested = [p for root in extracted for p in root.rglob("*.zip")]
              for nidx, nz in enumerate(nested):
                  dest = work / f"nested_{depth}_{nidx}"
                  dest.mkdir(exist_ok=True)
                  try:
                      with zipfile.ZipFile(nz) as zf:
                          if zf.testzip() is None: safe_extract(zf, dest)
                  except zipfile.BadZipFile:
                      continue
                  extracted.append(dest)

          markers = {"settings.gradle", "settings.gradle.kts"}
          roots = set()
          for root in extracted:
              for marker in markers:
                  for f in root.rglob(marker):
                      if any(part in {".gradle", "build", ".git"} for part in f.parts):
                          continue
                      roots.add(f.parent.resolve())

          if not roots:
              # Fallback only for single-module projects without settings.gradle.
              for root in extracted:
                  for f in root.rglob("build.gradle"):
                      if (f.parent / "src").exists() or (f.parent / "app").exists():
                          roots.add(f.parent.resolve())

          def score(p):
              s = 0
              if (p / "gradlew").exists(): s += 8
              if (p / "gradle/wrapper/gradle-wrapper.properties").exists(): s += 5
              if (p / "app/build.gradle").exists() or (p / "app/build.gradle.kts").exists(): s += 8
              if (p / "build.gradle").exists() or (p / "build.gradle.kts").exists(): s += 3
              if (p / "gradle/libs.versions.toml").exists(): s += 1
              return s

          ranked = sorted(roots, key=score, reverse=True)
          if not ranked:
              raise SystemExit("ZIP 内未发现可识别的 Android Gradle 项目。")
          if len(ranked) > 1 and score(ranked[0]) == score(ranked[1]):
              raise SystemExit("发现多个同等可能的 Gradle 项目，请拆分 ZIP 或明确只保留主项目。候选: " + ", ".join(str(x) for x in ranked[:8]))

          project = ranked[0]
          out = repo / "android_project"
          if out.exists(): shutil.rmtree(out)
          shutil.copytree(project, out, ignore=shutil.ignore_patterns(".gradle", "build", ".git"))
          print(f"项目根目录: {project}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"project_dir={out}\n")
          PY

      - name: Validate project and choose Gradle
        id: gradle
        shell: bash
        run: |
          cd android_project
          if [ -f gradle/wrapper/gradle-wrapper.properties ] && [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            echo "command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "Using project Gradle Wrapper"
          else
            echo "Wrapper incomplete; using compatible Gradle 8.9 fallback"
            echo "command=gradle" >> "$GITHUB_OUTPUT"
            echo "distribution=8.9" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fallback Gradle
        if: steps.gradle.outputs.command == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        env:
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          cd android_project
          TASK="${BUILD_TASK:-assembleDebug}"
          echo "Running $TASK"
          ${{ steps.gradle.outputs.command }} --no-daemon "$TASK"

      - name: Collect APK artifacts
        shell: bash
        run: |
          mkdir -p apk-output
          find android_project -type f -name "*.apk" -path "*/build/outputs/apk/*" -exec cp --parents {} apk-output/ \;
          if ! find apk-output -type f -name "*.apk" | grep -q .; then
            echo "构建任务结束，但没有找到 APK 产物。"
            exit 1
          fi
          find apk-output -type f -name "*.apk" -printf "%p (%s bytes)\n"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X2-Android-APK
          path: apk-output/**/*.apk
          if-no-files-found: error
          retention-days: 14
